[project]
name = "fabric-core"
version = "0.1.0"
description = "Shared contracts for the CloudLM data fabric: models, cursors, provider protocol"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_core"]
