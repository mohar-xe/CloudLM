[project]
name = "cloud-fabric"
version = "0.1.0"
description = "Read-only multi-cloud data fabric MCP server for CloudLM"
requires-python = ">=3.11"
dependencies = [
    "fabric-core",
    "mcp>=1.9,<2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
cloud-fabric = "cloud_fabric.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_fabric"]
